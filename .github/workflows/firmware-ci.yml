name: Firmware CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-firmware:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify Git
        shell: pwsh
        run: git --version

      - name: Verify 7-Zip
        shell: pwsh
        run: |
          $sevenZip = Get-Command 7z -ErrorAction Stop
          & $sevenZip.Source

      - name: Bootstrap CI environment
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.MCXA_LIB_TOKEN }}
        run: |
          .\scripts\ci\bootstrap.ps1 `
            -Root "${{ runner.temp }}\wallcontroller-ci"

      - name: Verify bootstrap environment
        shell: pwsh
        run: |
          $environmentFile = Join-Path "${{ runner.temp }}" "wallcontroller-ci\bootstrap-environment.json"
          if (-not (Test-Path -LiteralPath $environmentFile -PathType Leaf)) {
            throw "Bootstrap environment file was not generated: $environmentFile"
          }

      - name: Build firmware
        shell: pwsh
        run: |
          $buildLog = Join-Path "${{ runner.temp }}" "wallcontroller-ci\firmware-build.log"
          .\scripts\ci\build.ps1 `
            -EnvironmentFile "${{ runner.temp }}\wallcontroller-ci\bootstrap-environment.json" `
            -GenerateEphemeralSigningKey `
            -Clean *>&1 | Tee-Object -FilePath $buildLog
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            exit $buildExitCode
          }

      - name: Verify build result
        shell: pwsh
        run: |
          $resultFile = Join-Path "${{ runner.temp }}" "wallcontroller-ci\build\wallcontroller\build-result.json"
          if (-not (Test-Path -LiteralPath $resultFile -PathType Leaf)) {
            throw "Build result file was not generated: $resultFile"
          }

      - name: Write firmware summary
        shell: pwsh
        run: |
          $resultFile = Join-Path "${{ runner.temp }}" "wallcontroller-ci\build\wallcontroller\build-result.json"
          $result = Get-Content -LiteralPath $resultFile -Raw | ConvertFrom-Json

          $flashPercentage = if ($result.flash_capacity_bytes -gt 0) {
            [string]::Format(
              [Globalization.CultureInfo]::InvariantCulture,
              '{0:F2}%',
              (100.0 * $result.flash_used_bytes / $result.flash_capacity_bytes)
            )
          } else {
            'N/A'
          }
          $ramPercentage = if ($result.ram_capacity_bytes -gt 0) {
            [string]::Format(
              [Globalization.CultureInfo]::InvariantCulture,
              '{0:F2}%',
              (100.0 * $result.ram_used_bytes / $result.ram_capacity_bytes)
            )
          } else {
            'N/A'
          }
          $warningCount = if ($null -ne $result.warning_count) {
            $result.warning_count
          } else {
            'N/A'
          }
          $buildLog = Join-Path "${{ runner.temp }}" "wallcontroller-ci\firmware-build.log"
          $compilerWarnings = @()
          if (Test-Path -LiteralPath $buildLog -PathType Leaf) {
            $compilerWarnings = @(
              foreach ($line in Get-Content -LiteralPath $buildLog) {
                $plainLine = $line -replace "`e\[[0-9;]*[A-Za-z]", ''
                if ($plainLine -match '(?<warning>[^\\/]+:\d+:\d+:\s+warning:\s+.+)$') {
                  $Matches.warning
                }
              }
            ) | Select-Object -Unique
          }

          $summary = @(
            '# Firmware CI Summary'
            ''
            "- CI result: **$($result.status)**"
            "- Board: ``$($result.board)``"
            ''
            '| Metric | Value |'
            '|---|---:|'
            "| FLASH used | $($result.flash_used_bytes) bytes |"
            "| FLASH total | $($result.flash_capacity_bytes) bytes |"
            "| FLASH usage | $flashPercentage |"
            "| RAM used | $($result.ram_used_bytes) bytes |"
            "| RAM total | $($result.ram_capacity_bytes) bytes |"
            "| RAM usage | $ramPercentage |"
            "| zephyr.bin | $($result.artifact_sizes.bin) bytes |"
            "| zephyr.hex | $($result.artifact_sizes.hex) bytes |"
            "| Compiler warnings | $warningCount |"
            ''
            '## Compiler Warnings'
            ''
            if ($compilerWarnings.Count -gt 0) {
              '```text'
              $compilerWarnings
              '```'
            } elseif ($warningCount -eq 0) {
              'No compiler warnings were reported.'
            } else {
              'Compiler warning details were not available in the captured build log.'
            }
          ) -join [Environment]::NewLine

          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $summary -Encoding utf8

      - name: Enforce compiler warning gate
        shell: pwsh
        run: |
          $resultFile = Join-Path "${{ runner.temp }}" "wallcontroller-ci\build\wallcontroller\build-result.json"
          $result = Get-Content -LiteralPath $resultFile -Raw | ConvertFrom-Json

          $warningProperty = $result.PSObject.Properties['warning_count']
          if ($null -eq $warningProperty -or $null -eq $warningProperty.Value) {
            throw 'Compiler warning gate infrastructure error: warning_count is missing or null in build-result.json.'
          }

          $warningCount = 0
          $isInteger = [int]::TryParse(
            [string]$warningProperty.Value,
            [Globalization.NumberStyles]::Integer,
            [Globalization.CultureInfo]::InvariantCulture,
            [ref]$warningCount
          )
          if (-not $isInteger) {
            throw 'Compiler warning gate infrastructure error: warning_count could not be converted to an integer.'
          }
          if ($warningCount -lt 0) {
            throw 'Compiler warning gate infrastructure error: warning_count cannot be negative.'
          }
          if ($warningCount -gt 0) {
            throw "Compiler warning gate FAILED: $warningCount compiler warning(s) detected.`nSee the Firmware CI Summary for warning details."
          }

          Write-Host 'Compiler warning gate: PASS (0 warnings)'

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wallcontroller-firmware
          path: |
            ${{ runner.temp }}/wallcontroller-ci/build/wallcontroller/zephyr/zephyr.elf
            ${{ runner.temp }}/wallcontroller-ci/build/wallcontroller/zephyr/zephyr.bin
            ${{ runner.temp }}/wallcontroller-ci/build/wallcontroller/zephyr/zephyr.hex
            ${{ runner.temp }}/wallcontroller-ci/build/wallcontroller/zephyr/zephyr.signed.bin
            ${{ runner.temp }}/wallcontroller-ci/build/wallcontroller/zephyr/zephyr.signed.hex
            ${{ runner.temp }}/wallcontroller-ci/build/wallcontroller/build-result.json
            !${{ runner.temp }}/wallcontroller-ci/**/*.pem
            !${{ runner.temp }}/wallcontroller-ci/**/keys/**
          if-no-files-found: error
          retention-days: 7
