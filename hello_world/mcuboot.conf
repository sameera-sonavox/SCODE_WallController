# Match the public half of the RSA-2048 key used to sign the application image.
CONFIG_BOOT_SIGNATURE_TYPE_RSA=y
CONFIG_BOOT_SIGNATURE_TYPE_RSA_LEN=2048
CONFIG_BOOT_SIGNATURE_KEY_FILE="${APPLICATION_CONFIG_DIR}/keys/wallcontroller_publickey.pem"
CONFIG_BUILD_OUTPUT_HEX=y

# The secondary image slot is on the external Macronix flash.  Present 8 KiB
# logical sectors to MCUboot so swap-using-offset matches the MCXA156 internal
# flash erase-sector layout.  The SPI-NOR driver still performs the required
# physical 4 KiB erase operations underneath this logical layout.
CONFIG_SPI=y
CONFIG_SPI_NXP_LPSPI=y
CONFIG_SPI_NXP_LPSPI_DMA=n
CONFIG_SPI_NXP_LPSPI_CPU=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_MINIMAL=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=8192
CONFIG_WALLCONTROLLER_MCUBOOT_EXTFLASH_PROBE=y
